name: Publish Dashboard Image

on:
  push:
    branches:
      - main
    paths:
      - webapps/dashboard/**
      - packages/ui/**
      - deployment/nginx/dashboard.conf
      - webapps/dashboard/Dockerfile
      - package.json
      - bun.lock
      - .github/workflows/publish-dashboard.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish_dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/dashboard
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: webapps/dashboard/Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
